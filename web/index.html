<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conversor de Ficha Financeira</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">V</div>
      <div>
        <div class="brand-name">Valorizei</div>
        <div class="brand-sub">Conversor de fichas</div>
      </div>
    </div>
    <nav class="nav">
      <a class="active" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h12l4 4v12H4z"/><path d="M8 12h8M8 16h8M8 8h4"/></svg>
        Converter
      </a>
      <a href="#" id="nav-ajuda">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.8.4-1 .9-1 1.7M12 17h.01"/></svg>
        Ajuda
      </a>
    </nav>
    <div class="sidebar-foot">
      <button id="toggle-tema">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <span>Modo escuro</span>
      </button>
      <div class="version" id="versao">v1.0</div>
    </div>
  </aside>

  <main class="main">
    <div class="main-inner">
      <h1>Converter ficha financeira</h1>
      <p class="page-sub">Envie o PDF da ficha financeira e baixe a planilha Excel com os proventos por mês. O arquivo é processado na hora e não fica guardado.</p>

      <section class="card">
        <h2>1. Origem da ficha</h2>
        <p class="field-hint">Digite para pesquisar e escolha na lista.</p>
        <div class="combo" id="combo">
          <input type="text" id="combo-input" placeholder="Ex.: Serra, Espírito Santo…" autocomplete="off">
          <ul id="combo-list" hidden></ul>
        </div>
      </section>

      <section class="card">
        <h2>2. Arquivo PDF</h2>
        <div class="filepick">
          <label class="dropzone" id="dropzone" for="pdf-input">
            <div id="dz-text"><strong>Clique para escolher</strong> ou arraste o PDF aqui</div>
          </label>
          <input type="file" id="pdf-input" accept="application/pdf,.pdf">
        </div>
      </section>

      <button class="btn-primary" id="btn-converter" disabled>Converter para Excel</button>

      <section class="card" id="result-card" hidden style="margin-top:18px">
        <div class="result" id="result"></div>
      </section>
    </div>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
